# Meshline: unsigned iOS Release compile on every push/PR. Signed TestFlight
# shipping (cloud signing via ASC API key) is added once the Faro team's
# Program License Agreement is accepted and the ASC app record exists.
name: Meshline CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  compile:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Release build (iOS, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project bitchat.xcodeproj -scheme "bitchat (iOS)" -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/build.log"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" -c "Print :ITSAppUsesNonExemptEncryption" \
            "$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/"*.app/Info.plist
      - name: Log on failure
        if: failure()
        run: tail -150 "$RUNNER_TEMP/build.log"
  test-ios-sim:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "SIM=$UDID" >> "$GITHUB_ENV"
      - name: Unit + integration tests (iOS simulator)
        timeout-minutes: 45
        env:
          BITCHAT_SKIP_PERF_BASELINES: "1"
        run: |
          set -o pipefail
          xcodebuild test -project bitchat.xcodeproj -scheme "bitchat (iOS)" \
            -destination "id=$SIM" -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO \
            -skip-testing:bitchatTests/PerformanceBaselineTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 180 \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" 2>&1 | tee "$RUNNER_TEMP/test.log" \
            | grep -E --line-buffered "error:|failed|passed after|Executed|TEST (SUCCEEDED|FAILED)|Test run|started" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/test.log"
      - name: Failures
        if: failure()
        run: grep -nE "error:|failed \(" "$RUNNER_TEMP/test.log" | head -200; tail -80 "$RUNNER_TEMP/test.log"
